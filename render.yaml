# Agent Computer — Render (mode gratuit : veille auto + réveil à la demande)
# La machine s'endort après ~15 min sans visite et se réveille toute seule
# quand quelqu'un ouvre le site. Parfait pour un usage personnel à 0 €.
#
# Utilisation : Render → New → Blueprint (render.yaml) → connecter le dépôt Agent.
services:
  - type: web
    name: agent-computer
    runtime: docker
    repo: https://github.com/BrunoRakotomalala62/Agent
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # à saisir dans le dashboard Render (secret)
      - key: TERM_PASS
        sync: false
      - key: GITHUB_TOKEN
        sync: false        # pour que l'AGENT pousse automatiquement après chaque modif
      - key: GIT_USER
        value: Agent Computer
      - key: GIT_EMAIL
        value: agent@computer.local
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8125
